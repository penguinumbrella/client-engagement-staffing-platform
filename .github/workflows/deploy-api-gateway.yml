name: Deploy API Gateway

on:
  push:
    branches: [aws-preauth, main]
    paths:
      - 'api-gateway/**'

env:
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: Client-egagement-staffing-APIGateway
  EB_ENVIRONMENT_NAME: Client-egagement-staffing-APIGat-env
  S3_BUCKET: elasticbeanstalk-us-east-1-397345411365

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        continue-on-error: true # TODO: re-enable enforcement once tests are stable
        run: mvn -B test

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Package deployment bundle
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/application.jar
          cd deploy
          zip -r ../deploy-${{ github.sha }}.zip application.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy-${{ github.sha }}.zip s3://${{ env.S3_BUCKET }}/${{ env.EB_APPLICATION_NAME }}/deploy-${{ github.sha }}.zip

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "gh-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="${{ env.EB_APPLICATION_NAME }}/deploy-${{ github.sha }}.zip"

      - name: Deploy new version to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "gh-${{ github.sha }}"

      - name: Wait for environment to stabilize
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}"
