name: Deploy service to ECS

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Directory name / ECR repo name / ECS task family / ECS service name"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 397345411365.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: test-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::397345411365:role/github-actions-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      # Buildx + registry cache (mode=max) reuses multi-stage layers from ECR
      # (Maven base, dependency:go-offline, JRE+curl) so only changed layers
      # rebuild — typically just mvn package + the final jar copy.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service_name }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ inputs.service_name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ inputs.service_name }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ inputs.service_name }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ inputs.service_name }}:buildcache,mode=max

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ inputs.service_name }}-test \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      # Do not use `aws ecs wait services-stable`. That waiter also waits
      # until the old deployment has fully drained, which is most of the
      # delay. CI only needs the new (PRIMARY) tasks running.
      - name: Wait for new tasks to be running
        run: |
          set -euo pipefail
          SERVICE="${{ inputs.service_name }}-test"
          CLUSTER="${{ env.ECS_CLUSTER }}"
          REGION="${{ env.AWS_REGION }}"
          DEADLINE=$((SECONDS + 300))

          dump_failure() {
            echo "::error::New $SERVICE tasks did not reach running in time"
            aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
              --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,taskDef:taskDefinition,deployments:deployments[*].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks}}'
            aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
              --query 'services[0].events[:10].[createdAt,message]' --output table
            STOPPED=$(aws ecs list-tasks \
              --cluster "$CLUSTER" --service-name "$SERVICE" \
              --desired-status STOPPED --region "$REGION" \
              --query 'taskArns[:5]' --output text)
            if [ -n "${STOPPED:-}" ] && [ "$STOPPED" != "None" ]; then
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks $STOPPED --region "$REGION" \
                --query 'tasks[*].{stoppedReason:stoppedReason,containers:containers[*].{reason:reason,exitCode:exitCode}}'
            fi
          }

          while (( SECONDS < DEADLINE )); do
            SNAP=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].{running:runningCount,desired:desiredCount,pending:pendingCount,failed:failedTasks}' \
              --output json)
            RUNNING=$(echo "$SNAP" | jq -r '.running')
            DESIRED=$(echo "$SNAP" | jq -r '.desired')
            PENDING=$(echo "$SNAP" | jq -r '.pending')
            FAILED=$(echo "$SNAP" | jq -r '.failed // 0')
            echo "$(date -u +%H:%M:%S) primary running=$RUNNING desired=$DESIRED pending=$PENDING failed=$FAILED"

            if [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ]; then
              echo "New tasks are running (old tasks may still be draining — that is expected)"
              exit 0
            fi
            if [ "$FAILED" != "0" ] && [ "$FAILED" != "null" ]; then
              echo "PRIMARY deployment is accumulating failed tasks"
              dump_failure
              exit 1
            fi
            sleep 10
          done

          dump_failure
          exit 1
