cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://du83k7mttey3e.cloudfront.net,https://d1r0oi9vzejxs3.cloudfront.net}

spring:
    application:
        name: api-gateway
    output:
        ansi:
            enabled: always
    http:
        clients:
            redirects: dont-follow
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: client
                          uri: lb://client
                          predicates:
                              - Path=/client/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: client
                                    fallbackUri: forward:/fallback/client
                        - id: engagement
                          uri: lb://engagement
                          predicates:
                              - Path=/engagement/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: engagement
                                    fallbackUri: forward:/fallback/engagement
                        - id: staffing
                          uri: lb://staffing
                          predicates:
                              - Path=/staffing/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: staffing
                                    fallbackUri: forward:/fallback/staffing
                        - id: notification
                          uri: lb://notification
                          predicates:
                              - Path=/notification/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: notification
                                    fallbackUri: forward:/fallback/notification
                        - id: auth
                          uri: lb://auth-service
                          predicates:
                              - Path=/auth/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: auth
                                    fallbackUri: forward:/fallback/auth

server:
    port: 8125
    servlet:
        session:
            cookie:
                same-site: none
                secure: true

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://client-platform-eureka-env.us-east-1.elasticbeanstalk.com/eureka/
            #http://client-platform-Eureka-env.us-east-1.elasticbeanstalk.com:8761/eureka #http://10.0.0.10:8761/eureka/
    instance:
        prefer-ip-address: true
    #     hostname: 10.0.0.10
    #     prefer-ip-address: true
    #     instance-id: ${spring.application.name}:${random.uuid}

resilience4j:
    circuitbreaker:
        configs:
            default:
                sliding-window-size: 10
                minimum-number-of-calls: 5
                failure-rate-threshold: 50
                wait-duration-in-open-state: 15s
                permitted-number-of-calls-in-half-open-state: 3
        instances:
            client:
                base-config: default
            engagement:
                base-config: default
            staffing:
                base-config: default
            notification:
                base-config: default
            # Auth logins are bursty under load; default window (10 / 50%) opens too
            # early and then fails everything for 15s. Use a wider window and higher
            # threshold so brief saturation does not trip a full outage.
            auth:
                sliding-window-size: 50
                minimum-number-of-calls: 20
                failure-rate-threshold: 80
                wait-duration-in-open-state: 5s
                permitted-number-of-calls-in-half-open-state: 5
    timelimiter:
        configs:
            default:
                timeout-duration: 12s
        instances:
            client:
                base-config: default
            engagement:
                base-config: default
            staffing:
                base-config: default
            notification:
                base-config: default
            auth:
                base-config: default

gateway:
    stale-cache:
        ttl: 24h
        max-entries: 500
