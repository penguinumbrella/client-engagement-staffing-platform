cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://du83k7mttey3e.cloudfront.net,https://d1r0oi9vzejxs3.cloudfront.net}

spring:
    application:
        name: api-gateway
    output:
        ansi:
            enabled: always
    security:
        oauth2:
            resourceserver:
                jwt:
                    public-key-location: classpath:keys/public.pem
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: client
                          uri: lb://client
                          predicates:
                              - Path=/client/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: client
                                    fallbackUri: forward:/fallback/client
                        - id: engagement
                          uri: lb://engagement
                          predicates:
                              - Path=/engagement/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: engagement
                                    fallbackUri: forward:/fallback/engagement
                        - id: staffing
                          uri: lb://staffing
                          predicates:
                              - Path=/staffing/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: staffing
                                    fallbackUri: forward:/fallback/staffing
                        - id: notification
                          uri: lb://notification
                          predicates:
                              - Path=/notification/**
                          filters:
                              - name: CircuitBreaker
                                args:
                                    id: notification
                                    fallbackUri: forward:/fallback/notification
                        - id: auth
                          uri: lb://auth-service
                          predicates:
                            - Path=/auth/**
                          filters:
                              - StripPrefix=1
                              - name: CircuitBreaker
                                args:
                                    id: auth
                                    fallbackUri: forward:/fallback/auth

server:
    port: 8125
    servlet:
        session:
            cookie:
                same-site: none
                secure: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,gateway

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:8761/eureka/
            #http://client-platform-Eureka-env.us-east-1.elasticbeanstalk.com:8761/eureka #http://10.0.0.10:8761/eureka/
    # instance:
    #     hostname: 10.0.0.10
    #     prefer-ip-address: true
    #     instance-id: ${spring.application.name}:${random.uuid}

resilience4j:
    circuitbreaker:
        configs:
            default:
                sliding-window-size: 10
                minimum-number-of-calls: 5
                failure-rate-threshold: 50
                wait-duration-in-open-state: 15s
                permitted-number-of-calls-in-half-open-state: 3
        instances:
            client:
                base-config: default
            engagement:
                base-config: default
            staffing:
                base-config: default
            notification:
                base-config: default
            auth:
                base-config: default
    timelimiter:
        configs:
            default:
                timeout-duration: 5s
        instances:
            client:
                base-config: default
            engagement:
                base-config: default
            staffing:
                base-config: default
            notification:
                base-config: default
            auth:
                base-config: default
