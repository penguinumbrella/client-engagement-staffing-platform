spring:
  application:
    name: auth-service

  output:
    ansi:
      enabled: always

  datasource:
    url: ${AUTH_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, email, profile
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8125/auth/login/oauth2/code/google}

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: ${JWT_ISSUER:client-engagement-auth-service}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:4200/auth/callback}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true