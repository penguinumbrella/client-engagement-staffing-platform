spring:
    application:
        name: engagement
    output:
        ansi:
            enabled: always
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        defer-datasource-initialization: true
    sql:
        init:
            mode: always

server:
    port: 8082

eureka:
    client:
        service-url:
            defaultZone: http://client-platform-eureka-env.us-east-1.elasticbeanstalk.com/eureka/
    instance:
        prefer-ip-address: true
