spring:
    config:
        import: optional:file:.env[.properties]
    application:
        name: engagement
    output:
        ansi:
            enabled: always
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    sql:
        init:
            mode: always

server:
    port: 8082

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:8761/eureka/
        registry-fetch-interval-seconds: 5