<div
  class="cursor-pointer rounded-md bg-white p-3 shadow-sm"
  (click)="select.emit(client())"
>
  <div class="mb-2 flex items-start justify-between gap-2">
    <p class="m-0 text-sm font-semibold text-gray-900">{{ client().companyName }}</p>
    <span
      class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-medium"
      [class]="statusClasses()"
    >
      {{ client().relationshipStatus }}
    </span>
  </div>

  @if (client().industry) {
    <span
      class="mb-2 inline-block rounded-full bg-gray-100 px-2 py-0.5 text-[10px] font-medium text-gray-600"
    >
      {{ client().industry }}
    </span>
  }

  <div class="mt-2 text-xs text-gray-700">
    <p class="m-0">{{ client().primaryContactName }}</p>
    <p class="m-0 text-gray-500">{{ client().primaryContactEmail }}</p>
  </div>

  <div class="mt-3 flex justify-end gap-2">
    <button
      type="button"
      (click)="$event.stopPropagation(); edit.emit(client().id!)"
      class="rounded px-2 py-1 text-[11px] font-medium text-blue-600 hover:bg-blue-50"
    >
      Edit
    </button>
    <button
      type="button"
      (click)="$event.stopPropagation(); delete.emit(client().id!)"
      class="rounded px-2 py-1 text-[11px] font-medium text-red-600 hover:bg-red-50"
    >
      Delete
    </button>
  </div>
</div>
