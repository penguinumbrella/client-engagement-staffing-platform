<div
  class="cursor-pointer rounded-lg bg-[var(--p-surface-800)] p-3 shadow-sm"
  (click)="select.emit(client())"
>
  <div class="mb-2 flex items-start justify-between gap-2">
    <p class="m-0 text-sm font-semibold text-[var(--p-surface-50)]">{{ client().companyName }}</p>
    <span
      class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-medium"
      [class]="statusClasses()"
    >
      {{ client().relationshipStatus }}
    </span>
  </div>

  @if (client().industry) {
    <span
      class="mb-2 inline-block rounded-full bg-[var(--p-surface-700)] px-2 py-0.5 text-[10px] font-medium text-[var(--p-surface-300)]"
    >
      {{ client().industry }}
    </span>
  }

  <div class="mt-2 text-xs text-[var(--p-surface-200)]">
    <p class="m-0">{{ client().primaryContactName }}</p>
    <p class="m-0 text-[var(--p-surface-300)]">{{ client().primaryContactEmail }}</p>
  </div>
</div>
