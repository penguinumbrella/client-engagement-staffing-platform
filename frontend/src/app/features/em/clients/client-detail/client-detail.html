<div class="fixed inset-0 flex items-center justify-center bg-black/40" (click)="close.emit()">
  <div class="flex h-[720px] max-h-[90vh] w-[720px] max-w-[90vw] flex-col overflow-hidden rounded-lg bg-white" (click)="$event.stopPropagation()">
    <div class="border-b border-gray-100 p-6">
      <app-editable-company-name [value]="client().companyName" (valueChange)="updateCompanyName.emit($event)" />

      <div class="mb-4 flex flex-wrap items-center gap-1.5">
        <app-editable-relationship-status
          [value]="client().relationshipStatus"
          (valueChange)="updateRelationshipStatus.emit($event)"
        />
      </div>

      <div class="grid grid-cols-2 gap-x-6 gap-y-3">
        <app-editable-industry [value]="client().industry" (valueChange)="updateIndustry.emit($event)" />
        <app-editable-primary-contact-name
          [value]="client().primaryContactName"
          (valueChange)="updatePrimaryContactName.emit($event)"
        />
        <app-editable-primary-contact-email
          [value]="client().primaryContactEmail"
          (valueChange)="updatePrimaryContactEmail.emit($event)"
        />
      </div>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto p-6">
      <h4 class="m-0 mb-3 text-sm font-semibold text-gray-800">Engagements</h4>

      @if (loadingEngagements()) {
        <p class="m-0 px-1 py-4 text-center text-xs text-gray-400">Loading engagements…</p>
      } @else {
        <app-client-engagement-table [engagements]="engagements()" />
      }
    </div>
  </div>
</div>
