@if (everOpened()) {
<div
  class="fixed inset-0 z-50 bg-black/40 transition-opacity duration-300 ease-out"
  [class.opacity-100]="visible()"
  [class.opacity-0]="!visible()"
  [class.pointer-events-none]="!visible()"
  (click)="close()"
></div>

<div
  class="fixed inset-y-0 right-0 z-50 flex w-full max-w-lg flex-col overflow-y-auto bg-[var(--p-surface-800)] shadow-lg transition-transform duration-300 ease-out"
  [class.translate-x-0]="visible()"
  [class.translate-x-full]="!visible()"
>
  @if (client(); as client) {
    <div class="flex items-start justify-between gap-2 border-b border-[var(--p-surface-600)] p-4">
      <div class="min-w-0 flex-1">
        <app-editable-company-name [value]="client.companyName" (valueChange)="updateCompanyName.emit($event)" />

        <div class="flex flex-wrap items-center gap-1.5">
          <app-editable-relationship-status
            [value]="client.relationshipStatus"
            (valueChange)="updateRelationshipStatus.emit($event)"
          />
        </div>
      </div>

      <button
        type="button"
        (click)="close()"
        class="shrink-0 rounded px-2 py-1 text-xs font-medium text-[var(--p-surface-300)] hover:bg-[var(--p-surface-700)]"
      >
        ✕
      </button>
    </div>

    <div class="border-b border-[var(--p-surface-600)] p-4">
      <div class="grid grid-cols-2 gap-x-6 gap-y-3">
        <app-editable-industry [value]="client.industry" (valueChange)="updateIndustry.emit($event)" />
        <app-editable-primary-contact-name
          [value]="client.primaryContactName"
          (valueChange)="updatePrimaryContactName.emit($event)"
        />
        <app-editable-primary-contact-email
          [value]="client.primaryContactEmail"
          (valueChange)="updatePrimaryContactEmail.emit($event)"
        />
      </div>
    </div>

    <div class="flex-1 p-4">
      <h3 class="m-0 mb-3 text-xs font-semibold tracking-wide text-[var(--p-surface-300)] uppercase">Engagements</h3>

      @if (loadingEngagements()) {
        <p class="text-sm text-[var(--p-surface-300)]">Loading engagements…</p>
      } @else {
        <app-client-engagement-table [engagements]="engagements()" />
      }
    </div>
  }
</div>
}
