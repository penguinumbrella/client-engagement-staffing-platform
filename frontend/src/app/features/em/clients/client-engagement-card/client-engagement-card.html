<div class="flex h-36 flex-col rounded-lg bg-[var(--p-surface-800)] p-3 shadow-sm">
  <div class="mb-2 flex items-start justify-between gap-2">
    <p class="m-0 line-clamp-2 text-sm font-semibold text-[var(--p-surface-50)]">{{ engagement().engagementName }}</p>
    <span class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-medium" [class]="statusClasses()">
      {{ engagement().status }}
    </span>
  </div>

  <span class="mt-2 mb-2 inline-block w-fit rounded-full bg-[var(--p-surface-700)] px-2 py-0.5 text-[10px] font-medium text-[var(--p-surface-300)]">
    {{ engagement().engagementType }}
  </span>

  <div class="mt-auto text-xs text-[var(--p-surface-300)]">
    <p class="m-0">{{ formatDate(engagement().startDate) }} &ndash; {{ formatDate(engagement().targetEndDate) }}</p>
  </div>
</div>
