<div class="w-full rounded-lg bg-gray-100 p-3">
  <div class="mb-3 flex items-center gap-1">
    @for (tab of tabs; track tab.value) {
      <button
        type="button"
        (click)="activeFilter.set(tab.value)"
        class="rounded-full px-3 py-1 text-xs font-medium transition-colors"
        [class]="
          activeFilter() === tab.value
            ? 'bg-white text-gray-900 shadow-sm'
            : 'text-gray-500 hover:text-gray-700'
        "
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div class="grid min-h-[60px] grid-cols-2 gap-3">
    @for (engagement of filteredEngagements(); track engagement.id) {
      <app-client-engagement-card [engagement]="engagement" />
    } @empty {
      <p class="col-span-2 m-0 px-1 py-4 text-center text-xs text-gray-400">No engagements found.</p>
    }
  </div>
</div>
