<div class="px-4 pb-4" animate.enter="page-fade-in">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="m-0 text-lg font-semibold text-[var(--p-surface-50)]">Clients</h1>
    <button
      type="button"
      (click)="openCreate()"
      class="rounded-lg bg-amber-500 px-3 py-1.5 text-xs font-medium text-white hover:bg-amber-600"
    >
      + Create Client
    </button>
  </div>

  @if (loading()) {
    <app-spinny-bee />
  } @else if (error()) {
    <p class="text-sm text-red-600">{{ error() }}</p>
  } @else {
    <app-client-table [clients]="clients()" (select)="openDetail($event)" />
  }

  <app-client-form
    [mode]="formMode()"
    [client]="selectedClient()"
    [(visible)]="formVisible"
    (saved)="onSaved()"
    (deleted)="onDeleted($event)"
  />

  @if (detailClient(); as client) {
    <app-client-detail
      [client]="client"
      [(visible)]="detailVisible"
      (updateCompanyName)="updateCompanyName(client.id!, $event)"
      (updateRelationshipStatus)="updateRelationshipStatus(client.id!, $event)"
      (updateIndustry)="updateIndustry(client.id!, $event)"
      (updatePrimaryContactName)="updatePrimaryContactName(client.id!, $event)"
      (updatePrimaryContactEmail)="updatePrimaryContactEmail(client.id!, $event)"
      (delete)="openDelete(client.id!)"
    />
  }
</div>
