<div class="flex flex-col gap-1">
  @if (editing) {
    <input
      #draftInput
      class="m-0 w-full rounded-lg border border-indigo-300 px-1 text-xs text-[var(--p-surface-100)] outline-none"
      type="email"
      name="draft"
      [(ngModel)]="draft"
      (blur)="save()"
      (keydown.enter)="save()"
      (keydown.escape)="cancelEdit()"
    />
  } @else {
    <p
      class="m-0 cursor-pointer rounded-lg px-1 text-xs text-[var(--p-surface-200)] hover:bg-[var(--p-surface-800)]"
      title="Click to edit"
      (click)="startEdit()"
    >
      {{ value || 'Click to add a contact email…' }}
    </p>
  }
</div>
