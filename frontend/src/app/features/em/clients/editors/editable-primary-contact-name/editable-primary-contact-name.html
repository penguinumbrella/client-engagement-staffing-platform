<div class="flex flex-col gap-1">
  <span class="text-[10px] font-medium uppercase tracking-wide text-[var(--p-surface-400)]">Primary Contact</span>
  @if (editing) {
    <input
      #draftInput
      class="m-0 w-full rounded-md border border-indigo-300 p-1 text-xs text-[var(--p-surface-100)] outline-none"
      type="text"
      name="draft"
      [(ngModel)]="draft"
      (blur)="save()"
      (keydown.enter)="save()"
      (keydown.escape)="cancelEdit()"
    />
  } @else {
    <p
      class="m-0 cursor-pointer rounded-md p-1 text-xs text-[var(--p-surface-200)] hover:bg-[var(--p-surface-800)]"
      title="Click to edit"
      (click)="startEdit()"
    >
      {{ value || 'Click to add a contact name…' }}
    </p>
  }
</div>
