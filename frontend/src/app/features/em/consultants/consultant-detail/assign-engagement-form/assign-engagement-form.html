@if (visible()) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex w-full max-w-sm flex-col gap-3 rounded-md bg-white p-4 shadow-lg"
    >
      <h2 class="m-0 text-sm font-semibold text-gray-900">Assign Engagement</h2>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Engagement
        <select
          formControlName="engagementId"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        >
          <option [ngValue]="null" disabled>Select an engagement</option>
          @for (engagement of availableEngagements(); track engagement.id) {
            <option [ngValue]="engagement.id">{{ engagement.engagementName }}</option>
          }
        </select>
        @if (form.get('engagementId')?.invalid && form.get('engagementId')?.touched) {
          <small class="p-error">Engagement is required</small>
        }
        @if (availableEngagements().length === 0) {
          <small class="text-gray-400">No unassigned active engagements available.</small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Role
        <select
          formControlName="engagementRole"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        >
          @for (role of engagementRoles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </label>

      <div class="flex gap-3">
        <label class="flex flex-1 flex-col gap-1 text-xs text-gray-700">
          Start Date
          <input
            type="date"
            formControlName="assignmentStartDate"
            class="rounded border border-gray-300 px-2 py-1 text-sm"
          />
          @if (form.get('assignmentStartDate')?.invalid && form.get('assignmentStartDate')?.touched) {
            <small class="p-error">Start date is required</small>
          }
        </label>

        <label class="flex flex-1 flex-col gap-1 text-xs text-gray-700">
          End Date
          <input
            type="date"
            formControlName="assignmentEndDate"
            class="rounded border border-gray-300 px-2 py-1 text-sm"
          />
          @if (form.get('assignmentEndDate')?.invalid && form.get('assignmentEndDate')?.touched) {
            <small class="p-error">End date is required</small>
          }
        </label>
      </div>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Status
        <select
          formControlName="status"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        >
          @for (status of assignmentStatuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </label>

      @if (errorMessage()) {
        <p class="m-0 text-xs text-red-600">{{ errorMessage() }}</p>
      }

      <div class="mt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-100"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 disabled:opacity-50"
        >
          {{ submitting() ? 'Assigning…' : 'Assign' }}
        </button>
      </div>
    </form>
  </div>
}
