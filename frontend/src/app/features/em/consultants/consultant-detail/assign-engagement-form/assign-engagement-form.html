@if (visible()) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4" animate.enter="modal-backdrop-in" animate.leave="modal-backdrop-out">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex w-full max-w-sm flex-col gap-3 rounded-lg bg-[var(--p-surface-800)] p-4 shadow-lg"
      animate.enter="modal-panel-in"
      animate.leave="modal-panel-out"
    >
      <h2 class="m-0 text-sm font-semibold text-[var(--p-surface-50)]">Assign Engagement</h2>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        Engagement
        <select
          formControlName="engagementId"
          class="rounded-lg border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        >
          <option [ngValue]="null" disabled>Select an engagement</option>
          @for (engagement of availableEngagements(); track engagement.id) {
            <option [ngValue]="engagement.id">{{ engagement.engagementName }}</option>
          }
        </select>
        @if (form.get('engagementId')?.invalid && form.get('engagementId')?.touched) {
          <small class="p-error">Engagement is required</small>
        }
        @if (availableEngagements().length === 0) {
          <small class="text-[var(--p-surface-400)]">No unassigned active engagements available.</small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        Role
        <select
          formControlName="engagementRole"
          class="rounded-lg border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        >
          @for (role of engagementRoles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </label>

      <div class="flex gap-3">
        <label class="flex flex-1 flex-col gap-1 text-xs text-[var(--p-surface-200)]">
          Start Date
          <input
            type="date"
            formControlName="assignmentStartDate"
            class="rounded-lg border border-[var(--p-surface-500)] px-2 py-1 text-sm"
          />
          @if (form.get('assignmentStartDate')?.invalid && form.get('assignmentStartDate')?.touched) {
            <small class="p-error">Start date is required</small>
          }
        </label>

        <label class="flex flex-1 flex-col gap-1 text-xs text-[var(--p-surface-200)]">
          End Date
          <input
            type="date"
            formControlName="assignmentEndDate"
            class="rounded-lg border border-[var(--p-surface-500)] px-2 py-1 text-sm"
          />
          @if (form.get('assignmentEndDate')?.invalid && form.get('assignmentEndDate')?.touched) {
            <small class="p-error">End date is required</small>
          }
        </label>
      </div>

      <div class="mt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-lg px-3 py-1.5 text-xs font-medium text-[var(--p-surface-300)] hover:bg-[var(--p-surface-700)]"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 disabled:opacity-50"
        >
          {{ submitting() ? 'Assigning…' : 'Assign' }}
        </button>
      </div>
    </form>
  </div>
}
