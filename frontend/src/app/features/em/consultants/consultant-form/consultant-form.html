@if (visible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex w-full max-w-sm flex-col gap-3 rounded-md bg-[var(--p-surface-800)] p-4 shadow-lg"
    >
      <h2 class="m-0 text-sm font-semibold text-[var(--p-surface-50)]">
        Add User
      </h2>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        Account Type
        <select
          formControlName="role"
          class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        >
          @for (role of userRoles; track role.value) {
            <option [value]="role.value">{{ role.label }}</option>
          }
        </select>
      </label>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        First Name
        <input
          type="text"
          formControlName="firstName"
          placeholder="Jane"
          class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        />

        @if (
          form.get('firstName')?.invalid &&
          form.get('firstName')?.touched
        ) {
          <small class="p-error">
            First name is required
          </small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        Last Name
        <input
          type="text"
          formControlName="lastName"
          placeholder="Doe"
          class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        />

        @if (
          form.get('lastName')?.invalid &&
          form.get('lastName')?.touched
        ) {
          <small class="p-error">
            Last name is required
          </small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        Email
        <input
          type="email"
          formControlName="email"
          placeholder="jane.doe@example.com"
          class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        />

        @if (
          form.get('email')?.invalid &&
          form.get('email')?.touched
        ) {
          <small class="p-error">
            A valid email is required
          </small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
        Password
        <input
          type="password"
          formControlName="password"
          placeholder="Minimum 8 characters"
          class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
        />

        @if (
          form.get('password')?.invalid &&
          form.get('password')?.touched
        ) {
          <small class="p-error">
            Password must be at least 8 characters
          </small>
        }
      </label>

      @if (isConsultant()) {
        <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
          Title / Role
          <input
            type="text"
            formControlName="titleRole"
            placeholder="Senior Consultant"
            class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
          />

          @if (
            form.get('titleRole')?.invalid &&
            form.get('titleRole')?.touched
          ) {
            <small class="p-error">
              Title / role is required
            </small>
          }
        </label>

        <label class="flex flex-col gap-1 text-xs text-[var(--p-surface-200)]">
          Primary Skill Area
          <select
            formControlName="primarySkillArea"
            class="rounded border border-[var(--p-surface-500)] px-2 py-1 text-sm"
          >
            @for (area of skillAreas; track area) {
              <option [value]="area">{{ area }}</option>
            }
          </select>
        </label>
      }

      <div class="mt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded px-3 py-1.5 text-xs font-medium text-[var(--p-surface-300)] hover:bg-[var(--p-surface-700)]"
        >
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 disabled:opacity-50"
        >
          {{ submitting() ? 'Saving…' : 'Create User' }}
        </button>
      </div>
    </form>
  </div>
}
