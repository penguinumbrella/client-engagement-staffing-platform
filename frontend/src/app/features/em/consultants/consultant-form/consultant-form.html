@if (visible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="flex w-full max-w-sm flex-col gap-3 rounded-md bg-white p-4 shadow-lg"
    >
      <h2 class="m-0 text-sm font-semibold text-gray-900">Add Consultant</h2>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Name
        <input
          type="text"
          formControlName="name"
          placeholder="Jane Doe"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        />
        @if (form.get('name')?.invalid && form.get('name')?.touched) {
          <small class="p-error">Name is required</small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Email

        <input
          type="email"
          formControlName="email"
          placeholder="jane.doe@example.com"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        />

        @if (
          form.get('email')?.invalid &&
          form.get('email')?.touched
        ) {
          <small class="p-error">
            A valid email is required
          </small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Title / Role
        <input
          type="text"
          formControlName="titleRole"
          placeholder="Senior Consultant"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        />
        @if (form.get('titleRole')?.invalid && form.get('titleRole')?.touched) {
          <small class="p-error">Title / role is required</small>
        }
      </label>

      <label class="flex flex-col gap-1 text-xs text-gray-700">
        Primary Skill Area
        <select
          formControlName="primarySkillArea"
          class="rounded border border-gray-300 px-2 py-1 text-sm"
        >
          @for (area of skillAreas; track area) {
            <option [value]="area">{{ area }}</option>
          }
        </select>
      </label>

      <div class="mt-2 flex justify-end gap-2">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-100"
        >
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="submitting()"
          class="rounded bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 disabled:opacity-50"
        >
          {{ submitting() ? 'Saving…' : 'Create Consultant' }}
        </button>
      </div>
    </form>
  </div>
}
