<div class="fixed inset-0 z-10 flex items-center justify-center bg-black/40" (click)="cancel.emit()">
  <div class="flex w-72 flex-col gap-3 rounded-lg bg-white p-5 shadow-lg" (click)="$event.stopPropagation()">
    <h4 class="m-0 text-sm font-semibold text-gray-800">Edit Dates</h4>

    <label class="flex flex-col gap-1 text-xs font-medium text-gray-600">
      Start Date
      <input
        class="rounded-md border border-gray-200 px-2 py-1.5 text-sm text-gray-800"
        type="date"
        name="startDateDraft"
        [(ngModel)]="startDateDraft"
      />
    </label>

    <label class="flex flex-col gap-1 text-xs font-medium text-gray-600">
      Target End Date
      <input
        class="rounded-md border border-gray-200 px-2 py-1.5 text-sm text-gray-800"
        type="date"
        name="targetEndDateDraft"
        [(ngModel)]="targetEndDateDraft"
      />
    </label>

    <div class="mt-1 flex justify-end gap-2">
      <button type="button" class="rounded-md px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100" (click)="cancel.emit()">
        Cancel
      </button>
      <button
        type="button"
        class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="startDateDraft > targetEndDateDraft"
        (click)="submit()"
      >
        Save
      </button>
    </div>
  </div>
</div>
