@if (editing) {
  <select
    #draftSelect
    class="rounded-full border bg-white px-2 py-0.5 text-[10px] font-medium outline-none"
    [class]="selectClass"
    name="draft"
    [(ngModel)]="draft"
    (change)="save()"
    (blur)="cancelEdit()"
  >
    @for (option of options; track option) {
      <option [value]="option">{{ option }}</option>
    }
  </select>
} @else {
  <span
    class="cursor-pointer rounded-full px-2 py-0.5 text-[10px] font-medium"
    [class]="badgeClass"
    title="Click to edit"
    (click)="startEdit()"
  >
    {{ value }}
  </span>
}
