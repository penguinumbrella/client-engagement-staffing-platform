@if (editing) {
  <input
    #draftInput
    class="m-0 mb-2 w-full rounded-md border border-indigo-300 p-1 text-lg font-semibold text-gray-800 outline-none"
    type="text"
    name="draft"
    [(ngModel)]="draft"
    (blur)="save()"
    (keydown.enter)="save()"
    (keydown.escape)="cancelEdit()"
  />
} @else {
  <h3
    class="m-0 mb-2 cursor-pointer rounded-md p-1 text-lg font-semibold hover:bg-gray-50"
    title="Click to edit"
    (click)="startEdit()"
  >
    {{ value }}
  </h3>
}
