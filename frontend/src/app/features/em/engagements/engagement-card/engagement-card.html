<div
  class="cursor-pointer rounded-md bg-[var(--p-surface-800)] p-3 shadow-sm"
  cdkDrag
  [cdkDragData]="engagement"
  (click)="select.emit(engagement)"
>
  <div class="mb-1.5 flex items-center gap-1.5">
    <span
      class="flex h-4 w-4 shrink-0 items-center justify-center rounded-full text-[8px] font-bold text-white"
      [style.backgroundColor]="engagement.client.color"
    >
      {{ engagement.client.initials }}
    </span>
    <span class="flex-1 text-[11px] text-[var(--p-surface-300)]">{{ engagement.client.companyName }}</span>
  </div>

  <p class="m-0 mb-2 text-sm font-semibold">{{ engagement.engagementName }}</p>

  <span
    class="mb-2 inline-block rounded-full bg-[var(--p-surface-700)] px-2 py-0.5 text-[10px] font-medium text-[var(--p-surface-300)]"
  >
    {{ engagement.engagementType }}
  </span>

  <div class="flex -space-x-2">
    @for (consultant of engagement.consultants; track consultant.name) {
      <span
        class="flex h-6 w-6 items-center justify-center rounded-full border-2 border-white text-[10px] font-bold text-white"
        [style.backgroundColor]="consultant.color"
        [title]="consultant.name"
      >
        {{ consultant.initials }}
      </span>
    }
  </div>
</div>
