<div class="flex gap-3 overflow-x-auto">
  @for (month of months; track month.label) {
    <div class="w-[140px] shrink-0 rounded-lg border border-gray-200 p-2">
      <p class="m-0 mb-1.5 text-center text-[10px] font-semibold text-gray-700">{{ month.label }}</p>

      <div class="grid grid-cols-7 gap-y-0.5 text-center">
        @for (label of weekdayLabels; track $index) {
          <span class="text-[8px] font-medium text-gray-400">{{ label }}</span>
        }

        @for (day of month.days; track day.date.getTime()) {
          <span
            class="flex h-4 w-full items-center justify-center text-[9px]"
            [class.text-gray-300]="!day.inCurrentMonth"
            [class.text-gray-600]="day.inCurrentMonth && !day.inRange"
            [class.bg-indigo-500]="day.inRange"
            [class.text-white]="day.inRange"
            [class.rounded-l-full]="day.isRangeStart"
            [class.rounded-r-full]="day.isRangeEnd"
            [class.ring-1]="day.isToday"
            [class.ring-indigo-500]="day.isToday"
          >
            {{ day.date.getDate() }}
          </span>
        }
      </div>
    </div>
  }
</div>
