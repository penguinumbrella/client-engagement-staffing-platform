<div
  class="w-full min-w-0 rounded-xl border-2 border-dashed p-3"
  [style.background]="columnBackground(column.status)"
  [style.borderColor]="columnBorder(column.status)"
>
  <div class="mb-3 flex items-center justify-between">
    <h2 class="m-0 flex items-center gap-1.5 text-sm font-semibold text-gray-800">
      <i class="pi {{ statusIcon(column.status) }} {{ statusIconColor(column.status) }} text-xs"></i>
      {{ column.title }}
    </h2>
    @if (column.status !== cancelledStatus) {
      <button
        type="button"
        class="flex h-5 w-5 items-center justify-center rounded-full text-gray-600 hover:bg-black/10 hover:text-gray-800"
        title="Add engagement"
        (click)="add.emit(column.status)"
      >
        +
      </button>
    }
  </div>
  <div
    class="flex min-h-[60px] flex-col gap-2"
    cdkDropList
    [id]="column.status"
    [cdkDropListData]="column.engagements"
    [cdkDropListConnectedTo]="connectedTo"
    (cdkDropListDropped)="dropped.emit($event)"
  >
    @for (engagement of column.engagements; track engagement.id) {
      <app-engagement-card
        [engagement]="engagement"
        [class.opacity-60]="column.status === cancelledStatus"
        (select)="select.emit($event)"
      />
    }
  </div>
</div>
