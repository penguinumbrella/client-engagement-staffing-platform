<div class="w-64 shrink-0 rounded-lg bg-gray-100 p-3">
  <h2 class="m-0 mb-3 text-sm font-semibold text-gray-800">{{ column.title }}</h2>
  <div
    class="flex min-h-[60px] flex-col gap-2"
    cdkDropList
    [id]="column.status"
    [cdkDropListData]="column.engagements"
    [cdkDropListConnectedTo]="connectedTo"
    (cdkDropListDropped)="dropped.emit($event)"
  >
    @for (engagement of column.engagements; track engagement.id) {
      <app-engagement-card [engagement]="engagement" (select)="select.emit($event)" />
    }
  </div>
</div>
