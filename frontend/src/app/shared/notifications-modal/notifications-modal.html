<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  animate.enter="modal-backdrop-in"
  animate.leave="modal-backdrop-out"
  (click)="close.emit()"
>
  <div
    class="flex h-[520px] max-h-[85vh] w-[420px] max-w-[90vw] flex-col overflow-hidden rounded-xl bg-[var(--p-surface-800)]"
    animate.enter="modal-panel-in"
    animate.leave="modal-panel-out"
    (click)="$event.stopPropagation()"
  >
    <div class="flex shrink-0 items-center justify-between border-b border-[var(--p-surface-700)] px-4 py-3">
      <h3 class="m-0 text-sm font-semibold text-[var(--p-surface-100)]">Notifications</h3>
      <button
        type="button"
        class="flex h-7 w-7 items-center justify-center rounded-lg text-[var(--p-surface-300)] hover:bg-[var(--p-surface-700)]"
        title="Close"
        (click)="close.emit()"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto">
      @if (loading) {
        <div class="flex h-full items-center justify-center text-sm text-[var(--p-surface-400)]">
          Loading...
        </div>
      } @else if (notifications.length === 0) {
        <div class="flex h-full items-center justify-center text-sm text-[var(--p-surface-400)]">
          You're all caught up.
        </div>
      } @else {
        @for (notification of notifications; track notification.id) {
          <button
            type="button"
            class="flex w-full flex-col gap-1 border-b border-[var(--p-surface-700)] px-4 py-3 text-left hover:bg-[var(--p-surface-700)]"
            [class.bg-[var(--p-surface-750)]]="!notification.read"
            (click)="markAsRead(notification)"
          >
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-semibold uppercase tracking-wide text-[var(--p-surface-400)]">
                {{ typeLabel(notification.type) }}
              </span>
              @if (!notification.read) {
                <span class="h-2 w-2 shrink-0 rounded-full bg-indigo-500"></span>
              }
            </div>
            <span class="text-sm font-medium text-[var(--p-surface-100)]">{{ notification.title }}</span>
            <span class="text-xs text-[var(--p-surface-300)]">{{ notification.message }}</span>
          </button>
        }
      }
    </div>
  </div>
</div>
