spring:
    datasource:
        url: jdbc:h2:mem:staffingtest;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:
    jpa:
        hibernate:
            ddl-auto: create-drop
    sql:
        init:
            mode: never
    security:
        oauth2:
            resourceserver:
                jwt:
                    public-key-location: classpath:keys/public.pem

notification:
    kafka:
        topic: notification.events

eureka:
    client:
        enabled: false
        register-with-eureka: false
        fetch-registry: false
